{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="form-card">
      <div class="text-center mb-4">
        <div class="mb-3" style="font-size:3rem;color:var(--primary)"><i class="bi bi-bag-fill"></i></div>
        <h3 class="fw-bold">Welcome Back</h3>
        <p class="text-muted">Sign in to your RPSV account</p>
      </div>
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0" name="username"
                   placeholder="Enter your username" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" name="password"
                   placeholder="Enter your password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>
      <hr class="my-4">
      <p class="text-center text-muted mb-0">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Create one</a>
      </p>

    </div>
  </div>
</div>
{% endblock %}
